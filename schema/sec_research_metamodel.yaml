id: https://decretum.dev/schema/security-research
name: security_research_metamodel
title: Decretum Security Research Metamodel
license: MIT
definition_uri_prefixes:
  sec: https://decretum.dev/schema/
enums:
  ResearcherRole:
    permissible_values:
      threat_researcher: {}
      supply_chain_auditor: {}
      detection_engineer: {}
      vulnerability_exploit_researcher: {}
  ComputeProvider:
    permissible_values:
      lima: {}
      podman: {}
      docker: {}
  HashAlgorithm:
    permissible_values:
      sha256: {}
  InstrumentationTool:
    permissible_values:
      tetragon: {}
      bpftrace: {}
      strace: {}
      tcpdump: {}
      tshark: {}
  Harness:
    permissible_values:
      goose: {}
      pi: {}
      headless: {}
  Framework:
    permissible_values:
      mitre_attack: {}
      d3fend: {}
      capec: {}
      cve: {}
      cti_advisory: {}
  ArtifactKind:
    permissible_values:
      package_audit_log: {}
      file_diff: {}
      dns_lookup: {}
      pcap: {}
      process_memory_dump: {}
      syscall_log: {}
      asan_crash_log: {}
      core_dump: {}
      gdb_backtrace: {}
  ReportFormat:
    permissible_values:
      markdown: {}
      json: {}
      sigma: {}
      yara: {}
      cyclonedx: {}
      stix21: {}

classes:
  ResearchRecipe:
    tree_root: true
    attributes:
      id:
        range: string
        required: true
      name:
        range: string
        required: true
      version:
        range: string
        required: true
      role:
        range: ResearcherRole
        required: true
      objective:
        range: string
        required: true
      harness:
        range: Harness
        required: true
      compute:
        range: ComputeSpec
        required: true
      instrumentation:
        range: InstrumentationSpec
      evidence:
        range: EvidenceSpec
        required: true
      references:
        range: string
        multivalued: true
      workload:
        range: WorkloadSpec
        required: true
      reports:
        range: ReportSpec
        multivalued: true

  ComputeSpec:
    attributes:
      provider:
        range: ComputeProvider
        required: true
      base_image:
        range: string
        required: true
      cpus:
        range: integer
        minimum_value: 1
        required: true
      memory:
        range: string
        required: true
      network:
        range: string
      allow_host_mounts:
        range: boolean
        ifabsent: false

  InstrumentationSpec:
    attributes:
      tools:
        range: InstrumentationTool
        multivalued: true
      trace_flags:
        range: string
        multivalued: true

  EvidenceSpec:
    attributes:
      artifact_paths:
        range: string
        multivalued: true
        required: true
      hash_algorithm:
        range: HashAlgorithm
        ifabsent: sha256
      manifest:
        range: boolean
        ifabsent: true

  WorkloadSpec:
    attributes:
      command:
        range: string
        required: true
      timeout_seconds:
        range: integer
        minimum_value: 1
        ifabsent: 300

  ReportSpec:
    attributes:
      kind:
        range: ReportFormat
        required: true
      template:
        range: string
        required: true
