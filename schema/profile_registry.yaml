apiVersion: decretum.dev/v1
kind: ProfileRegistry
version: "1.0"

# Profiles are researcher preferences/configuration.
# They do not define canonical capability semantics.
# Provider implementations remain in provider_registry.yaml.

infrastructure:
  isolated-linux-vm:
    type: infrastructure
    description: Isolated Linux VM preference for security research.
    compute:
      type: vm
      preferred_providers:
        - lima
        - incus
        - qemu
      architecture: amd64
      vcpus: 4
      memory: 8Gi
      disk: 40Gi
    os:
      family: linux
      distribution: ubuntu
      version: "24.04"
    network:
      mode: isolated
    lifecycle:
      ephemeral: true
      snapshot: true

  local-container:
    type: infrastructure
    description: Isolated container preference for lightweight research.
    compute:
      type: container
      preferred_providers:
        - podman
        - docker
        - incus
      resources:
        cpus: 4
        memory: 8Gi
    network:
      mode: isolated
    lifecycle:
      ephemeral: true
      snapshot: true

instrumentation:
  linux-network-observation:
    type: instrumentation
    description: Linux process, syscall, and network observation preference.
    preferred_providers:
      - sysdig
      - zeek
    required_capabilities:
      - syscall.observe
      - network.metadata
    collectors:
      - process
      - syscall
      - network_metadata
    trace_flags: []

  ebpf-observation:
    type: instrumentation
    description: eBPF-based process and syscall observation preference.
    preferred_providers:
      - tetragon
      - tracee
      - bpftrace
    required_capabilities:
      - process.observe
      - syscall.observe
    collectors:
      - process
      - syscall
    trace_flags: []

harness:
  interactive-research:
    type: harness
    preferred:
      - codex
      - goose
      - open_code
    mode: interactive
    researcher_approval: true
