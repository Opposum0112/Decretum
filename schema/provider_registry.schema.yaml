id: https://decretum.dev/schema/provider-registry
name: provider_registry
title: Decretum Capability Provider Registry

enums:
  ProviderInterfaceType:
    permissible_values: {mcp: {}, api: {}, tool: {}}
  HarnessKind:
    permissible_values: {agent: {}}
  ModelKind:
    permissible_values: {llm: {}}

classes:
  ProviderInterface:
    attributes:
      type: {range: ProviderInterfaceType, required: true}
      executable: {range: string}
      endpoint: {range: string}
      server: {range: string}
      transport: {range: string}
      command: {range: string}

  CapabilityProvider:
    attributes:
      id: {range: string, required: true}
      interface: {range: ProviderInterface, required: true}
      capabilities: {range: string, multivalued: true, required: true}
      integrations: {range: string, multivalued: true}

  Integration:
    attributes:
      id: {range: string, required: true}
      type: {range: ProviderInterfaceType, required: true}
      provider: {range: string, required: true}
      transport: {range: string}
      endpoint: {range: string}
      command: {range: string}

  Harness:
    attributes:
      id: {range: string, required: true}
      kind: {range: HarnessKind, required: true}
      supported_interfaces: {range: ProviderInterfaceType, multivalued: true}
      adapter: {range: string}
      contract_version: {range: string}

  Model:
    attributes:
      id: {range: string, required: true}
      kind: {range: ModelKind, required: true}
      env: {range: string}

  CapabilityProviderRegistry:
    tree_root: true
    attributes:
      apiVersion: {range: string, required: true}
      kind: {range: string, required: true}
      version: {range: string, required: true}
      providers: {range: CapabilityProvider, multivalued: true, required: true}
      integrations: {range: Integration, multivalued: true}
      harnesses: {range: Harness, multivalued: true}
      models: {range: Model, multivalued: true}
