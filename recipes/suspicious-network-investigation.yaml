apiVersion: decretum.dev/v1
kind: ResearchExperiment
id: suspicious-network-investigation
name: Suspicious Network Investigation
version: "2.0"
role: threat_researcher
objective: >
  Determine whether a sample creates unexpected process and network activity.

# Recipes compose canonical capabilities; they do not define capability semantics.
capabilities:
  - process.observe
  - network.capture
  - artifact.collect

# Preferences/configuration are reusable profiles and are deliberately separate
# from experiment composition.
infrastructure_profile: isolated-linux-vm
instrumentation_profile: linux-network-observation
harness_profile: interactive-research

experiments:
  - id: observe-process
    objective: Observe process execution.
    capabilities: [process.observe]

  - id: capture-network
    objective: Capture network activity.
    capabilities: [network.capture]
    depends_on: [observe-process]

  - id: preserve-results
    objective: Preserve research evidence.
    capabilities: [artifact.collect]
    depends_on: [capture-network]

environment:
  type: local
  sandbox:
    backend: lima
    workspace_directory: .
    inherit_host_environment: false
  network:
    mode: isolated
  privileged: false
  programmatic_tool_calling: true

policy:
  allow:
    - artifact.read
    - artifact.collect
    - process.observe
    - network.observe
    - network.capture
  deny:
    - host.filesystem.write
    - host.mount
    - privileged.host_access
    - unrestricted.network

evidence:
  required:
    - process_activity
    - network_activity

completion:
  report_required: true
  conclusion_required: true

reports:
  - kind: markdown
    template: security-research
