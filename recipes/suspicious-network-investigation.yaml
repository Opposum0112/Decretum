apiVersion: decretum.dev/v1
kind: ResearchExperiment
id: suspicious-network-investigation
name: Suspicious Network Investigation
version: "1.0"
role: threat_researcher
objective: >
  Determine whether a sample creates unexpected process and network activity.
capability_catalog:
  - id: process.observe
    name: Observe processes
    kind: process
    risk: observe
    description: Observe process execution and metadata.
  - id: network.capture
    name: Capture network activity
    kind: network
    risk: collect
    description: Capture network traffic for behavioral analysis.
  - id: artifact.collect
    name: Collect evidence artifacts
    kind: artifact
    risk: collect
    description: Preserve research artifacts and evidence.
  - id: syscall.observe
    name: Observe syscalls
    kind: instrumentation
    risk: observe
    description: Observe system call activity generated by the workload.
  - id: network.metadata
    name: Observe network metadata
    kind: network
    risk: observe
    description: Produce structured metadata about observed network activity.
  - id: compute.vm
    name: Run a virtual machine
    kind: container
    risk: execute
    description: Execute the research workload inside a virtual machine.
capabilities:
  - process.observe
  - network.capture
  - artifact.collect
instrumentation:
  required:
    - syscall.observe
    - network.metadata
  preferred:
    - sysdig
    - zeek
compute:
  required:
    - compute.vm
  preferred:
    - lima
    - incus
experiments:
  - id: observe-process
    objective: Observe process execution.
    capabilities: [process.observe]
  - id: capture-network
    objective: Capture network activity.
    capabilities: [network.capture]
    depends_on: [observe-process]
  - id: preserve-results
    objective: Preserve research evidence.
    capabilities: [artifact.collect]
    depends_on: [capture-network]
environment:
  type: local
  sandbox:
    backend: lima
    workspace_directory: .
    inherit_host_environment: false
  network:
    mode: isolated
  privileged: false
  programmatic_tool_calling: true
policy:
  allow:
    - artifact.read
    - artifact.collect
    - process.observe
    - network.observe
    - network.capture
    - syscall.observe
    - network.metadata
  deny:
    - host.filesystem.write
    - host.mount
    - privileged.host_access
    - unrestricted.network
evidence:
  required:
    - process_activity
    - network_activity
completion:
  report_required: true
  conclusion_required: true
reports:
  - kind: markdown
    template: security-research
