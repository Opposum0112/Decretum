id: supply-chain-audit
name: NPM/PyPI supply-chain audit
version: "1.0"
role: supply_chain_auditor
objective: Observe package installation behavior and collect auditable evidence.
harness: headless
compute:
  provider: podman
  base_image: docker.io/library/python:3.12-slim
  cpus: 2
  memory: 2g
  network: none
  allow_host_mounts: false
instrumentation:
  tools: [strace, tcpdump, tshark]
  trace_flags: [execve, connect]
evidence:
  artifact_paths: [/tmp/audit.log, /tmp/package-diff.json, /tmp/dns.log]
  hash_algorithm: sha256
  manifest: true
workload:
  command: python -m pip --version
  timeout_seconds: 120
reports:
  - kind: cyclonedx
    template: supply-chain-sbom
  - kind: markdown
    template: supply-chain-risk
