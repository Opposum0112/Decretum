[project]
name = "decretum-software-engineering"
version = "0.1.0"
description = "Software engineering domain pack for Decretum"
requires-python = ">=3.11"
dependencies = ["decretum>=0.3.0"]

[project.entry-points."decretum.domain_packs"]
software-engineering = "decretum_software_engineering:domain_pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decretum_software_engineering"]
