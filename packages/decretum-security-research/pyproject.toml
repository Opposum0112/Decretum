[project]
name = "decretum-security-research"
version = "0.1.0"
description = "Security research domain pack for Decretum"
requires-python = ">=3.11"
dependencies = ["decretum>=0.3.0"]

[project.entry-points."decretum.domain_packs"]
security-research = "decretum_security_research:domain_pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decretum_security_research"]
