apiVersion: decretum.dev/v1
kind: CapabilityProviderRegistry
version: "1.3"

# Capability is the stable semantic contract.
# Providers are concrete implementations. Harnesses orchestrate them.
# Integrations expose providers through MCP/API/tool transports.
providers:
  tcpdump:
    interface: {type: tool, executable: tcpdump}
    capabilities: [network.capture, network.observe]
    isolation: host
    network: host
    privileged: false
    execution_modes: [capture]
  tshark:
    interface: {type: tool, executable: tshark}
    capabilities: [network.capture, network.observe, protocol.analyze]
    isolation: host
    network: host
    privileged: false
    execution_modes: [capture, analyze]
  strace:
    interface: {type: tool, executable: strace}
    capabilities: [process.observe, syscall.observe]
  tetragon:
    interface: {type: api, endpoint: local:tetragon}
    capabilities: [process.observe, network.observe, filesystem.observe, syscall.observe, container.observe, kernel.trace]
  sysdig:
    interface: {type: tool, executable: sysdig}
    capabilities: [process.observe, filesystem.observe, network.observe, syscall.observe, container.observe]
  tracee:
    interface: {type: tool, executable: tracee}
    capabilities: [process.observe, syscall.observe, filesystem.observe, network.observe, container.observe]
  bpftrace:
    interface: {type: tool, executable: bpftrace}
    capabilities: [process.observe, syscall.observe, filesystem.observe, network.observe, kernel.trace]
  bpftool:
    interface: {type: tool, executable: bpftool}
    capabilities: [kernel.trace, syscall.observe]
  perf:
    interface: {type: tool, executable: perf}
    capabilities: [process.observe, syscall.observe, kernel.trace]
  dumpcap:
    interface: {type: tool, executable: dumpcap}
    capabilities: [network.capture, network.observe]
  falco:
    interface: {type: api, endpoint: local:falco}
    capabilities: [process.observe, filesystem.observe, network.observe, syscall.observe, container.observe, detection.observe]
  pcap-mcp:
    interface: {type: mcp, server: pcap}
    capabilities: [network.capture, network.observe]
  artifact-filesystem:
    interface: {type: tool, executable: filesystem}
    capabilities: [artifact.read, artifact.collect, filesystem.observe]
  local-process:
    interface: {type: tool, executable: shell}
    capabilities: [process.execute, process.observe]
  lima:
    interface: {type: api, endpoint: local:lima}
    capabilities: [compute.vm, compute.snapshot, workspace.execute]
    isolation: vm
    network: isolated
    architectures: [amd64, arm64]
    supports_snapshot: true
    supports_ephemeral: true
  docker:
    interface: {type: api, endpoint: local:docker}
    capabilities: [compute.container, compute.snapshot, workspace.execute]
  podman:
    interface: {type: api, endpoint: local:podman}
    capabilities: [compute.container, compute.snapshot, workspace.execute]
  incus:
    interface: {type: api, endpoint: local:incus}
    capabilities: [compute.container, compute.vm, compute.snapshot, workspace.execute]
  qemu:
    interface: {type: tool, executable: qemu-system}
    capabilities: [compute.vm, compute.snapshot]
  kvm:
    interface: {type: tool, executable: qemu-system}
    capabilities: [compute.vm, compute.snapshot]
  firecracker:
    interface: {type: tool, executable: firecracker}
    capabilities: [compute.microvm, compute.snapshot]
  libvirt:
    interface: {type: api, endpoint: local:libvirt}
    capabilities: [compute.vm, compute.snapshot, workspace.execute]
    isolation: vm
    network: isolated
    architectures: [amd64, arm64]
    supports_snapshot: true
    supports_ephemeral: true
  multipass:
    interface: {type: api, endpoint: local:multipass}
    capabilities: [compute.vm, compute.snapshot, workspace.execute]
    isolation: vm
    network: isolated
    architectures: [amd64, arm64]
    supports_snapshot: true
    supports_ephemeral: true
  vagrant:
    interface: {type: tool, executable: vagrant}
    capabilities: [compute.vm, workspace.execute]
    isolation: vm
    network: isolated
  volatility:
    interface: {type: tool, executable: volatility}
    capabilities: [memory.acquire, memory.analyze]
  yara:
    interface: {type: tool, executable: yara}
    capabilities: [artifact.scan, malware.analyze]
  ghidra:
    interface: {type: tool, executable: ghidra}
    capabilities: [binary.analyze, reverse_engineer]
  zeek:
    interface: {type: tool, executable: zeek}
    capabilities: [network.capture, network.observe, protocol.analyze, network.metadata]
  suricata:
    interface: {type: tool, executable: suricata}
    capabilities: [network.capture, network.observe, network.detection]

integrations:
  pcap-mcp:
    type: mcp
    provider: pcap-mcp
  local-tools:
    type: tool
    provider: local-process
  docker-api:
    type: api
    provider: docker
  podman-api:
    type: api
    provider: podman
  lima-api:
    type: api
    provider: lima
  incus-api:
    type: api
    provider: incus

# Harnesses describe the operational adapter boundary.
# supported_interfaces says which integration transports the adapter can consume.
# operations says what the adapter can do with a resolved execution surface.
harnesses:
  codex:
    kind: agent
    supported_interfaces: [mcp, api, tool]
    operations: [provision, implement_capabilities, execute, orchestrate, collect_evidence, researcher_interaction]
  goose:
    kind: agent
    supported_interfaces: [mcp, api, tool]
    operations: [provision, implement_capabilities, execute, orchestrate, collect_evidence, researcher_interaction]
  open_code:
    kind: agent
    supported_interfaces: [mcp, api, tool]
    operations: [provision, implement_capabilities, execute, orchestrate, collect_evidence, researcher_interaction]
  google_adk:
    kind: agent
    supported_interfaces: [mcp, api, tool]
    operations: [provision, implement_capabilities, execute, orchestrate, collect_evidence, researcher_interaction]
  vercel_ai:
    kind: agent
    supported_interfaces: [mcp, api, tool]
    operations: [provision, implement_capabilities, execute, orchestrate, collect_evidence, researcher_interaction]

models:
  openai:
    kind: llm
    env: OPENAI_API_KEY
  anthropic:
    kind: llm
    env: ANTHROPIC_API_KEY
  google:
    kind: llm
    env: GOOGLE_API_KEY
  xai:
    kind: llm
    env: XAI_API_KEY
