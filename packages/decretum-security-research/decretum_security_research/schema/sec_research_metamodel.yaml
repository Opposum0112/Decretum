id: https://decretum.dev/schema/security-research
name: security_research_metamodel
title: Decretum Security Research Reference Metamodel
license: MIT
definition_uri_prefixes:
  sec: https://decretum.dev/schema/

enums:
  ResearcherRole:
    permissible_values:
      threat_researcher: {}
      supply_chain_auditor: {}
      detection_engineer: {}
      vulnerability_exploit_researcher: {}
      malware_researcher: {}
      threat_intelligence_researcher: {}
      cloud_security_researcher: {}
      forensics_researcher: {}
      vulnerability_researcher: {}
      security_architect: {}

  CapabilityKind:
    permissible_values:
      artifact: {}
      filesystem: {}
      process: {}
      network: {}
      identity: {}
      cloud: {}
      container: {}
      instrumentation: {}
      analysis: {}
      reporting: {}
      compute: {}

  CapabilityRisk:
    permissible_values:
      read: {}
      observe: {}
      collect: {}
      execute: {}
      write: {}
      privileged: {}
      network_access: {}

  SkillKind:
    permissible_values:
      analysis: {}
      investigation: {}
      detection: {}
      forensics: {}
      threat_intelligence: {}
      malware_analysis: {}
      vulnerability_research: {}
      cloud_security: {}
      reverse_engineering: {}
      network_analysis: {}
      software_supply_chain: {}
      reporting: {}

  SkillExecutionMode:
    permissible_values:
      codex_native: {}
      shell: {}
      mcp: {}
      script: {}
      analyst_review: {}

  EnvironmentType:
    permissible_values:
      local: {}

  ReferenceType:
    permissible_values:
      security_framework: {}
      threat_intelligence_report: {}
      threat_intelligence_feed: {}
      vendor_advisory: {}
      vulnerability_database: {}
      research_paper: {}
      incident_report: {}
      malware_report: {}
      detection_content: {}
      standards_document: {}

  ReferenceAuthority:
    permissible_values:
      mitre: {}
      nist: {}
      cisa: {}
      microsoft: {}
      google: {}
      aws: {}
      palo_alto_networks: {}
      crowdstrike: {}
      mandiant: {}
      vendor: {}
      community: {}
      researcher: {}

  FindingStatus:
    permissible_values:
      observed: {}
      supported: {}
      refuted: {}
      inconclusive: {}
      superseded: {}

  ReportFormat:
    permissible_values:
      markdown: {}
      json: {}
      sigma: {}
      yara: {}
      cyclonedx: {}
      stix21: {}

classes:
  ResearchRecipe:
    tree_root: true
    attributes:
      id: {range: string, required: true}
      name: {range: string, required: true}
      version: {range: string, required: true}
      role: {range: ResearcherRole}
      role_definition: {range: RoleSpec}
      skills: {range: SkillSpec, multivalued: true}
      skill_catalog: {range: SkillSpec, multivalued: true}
      capability_catalog: {range: CapabilitySpec, multivalued: true}
      objective: {range: string, required: true}
      inputs: {range: InputSpec}
      capabilities: {range: string, multivalued: true}
      experiments: {range: ExperimentStep, multivalued: true}
      environment: {range: EnvironmentSpec}
      policy: {range: PolicySpec}
      infrastructure_profile: {range: string}
      instrumentation_profile: {range: string}
      harness_profile: {range: string}
      evidence: {range: EvidenceSpec}
      completion: {range: CompletionSpec}
      references: {range: ResearchReference, multivalued: true}
      persistent_findings: {range: PersistentFinding, multivalued: true}
      workload: {range: WorkloadSpec}
      reports: {range: ReportSpec, multivalued: true}
      hypotheses: {range: Hypothesis, multivalued: true}
      experiment_requests: {range: ExperimentRequest, multivalued: true}
      findings: {range: ResearchFinding, multivalued: true}

  # CapabilitySpec is a local recipe declaration only for backwards compatibility.
  # Canonical capability semantics live in capability_registry.yaml.
  CapabilitySpec:
    attributes:
      id: {range: string, required: true}
      name: {range: string, required: true}
      kind: {range: CapabilityKind, required: true}
      risk: {range: CapabilityRisk, required: true}
      description: {range: string, required: true}
      requires_approval: {range: boolean, ifabsent: false}
      tools: {range: string, multivalued: true}
      evidence_outputs: {range: string, multivalued: true}
      allowed_isolations: {range: string, multivalued: true}
      allowed_networks: {range: string, multivalued: true}
      allowed_execution_modes: {range: string, multivalued: true}

  SkillSpec:
    attributes:
      id: {range: string, required: true}
      name: {range: string, required: true}
      kind: {range: SkillKind, required: true}
      description: {range: string, required: true}
      execution_mode: {range: SkillExecutionMode, ifabsent: codex_native}
      capabilities: {range: string, multivalued: true}
      tools: {range: string, multivalued: true}
      evidence_inputs: {range: string, multivalued: true}
      evidence_outputs: {range: string, multivalued: true}
      framework_mappings: {range: string, multivalued: true}
      enabled: {range: boolean, ifabsent: true}

  RoleSpec:
    attributes:
      id: {range: ResearcherRole, required: true}
      description: {range: string}
      skills: {range: string, multivalued: true}
      default_capabilities: {range: string, multivalued: true}
      allowed_tools: {range: string, multivalued: true}
      enabled: {range: boolean, ifabsent: true}

  InputSpec:
    attributes:
      sample: {range: string}
      workload: {range: string}
      artifact: {range: string}
      artifacts: {range: string, multivalued: true}

  EnvironmentSpec:
    attributes:
      type: {range: EnvironmentType, ifabsent: local}
      compute: {range: ComputeSpec}
      sandbox: {range: SandboxSpec, required: true}
      network: {range: NetworkSpec}
      privileged: {range: boolean, ifabsent: false}
      programmatic_tool_calling: {range: boolean, ifabsent: true}
      mcp: {range: McpServerSpec, multivalued: true}
      codex: {range: CodexSpec}
      orchestration: {range: OrchestrationSpec}

  ResearchReference:
    attributes:
      id: {range: string, required: true}
      type: {range: ReferenceType, required: true}
      authority: {range: ReferenceAuthority}
      title: {range: string, required: true}
      uri: {range: uri}
      citation: {range: string}
      version: {range: string}
      accessed_at: {range: string}
      notes: {range: string}

  PersistentFinding:
    attributes:
      id: {range: string, required: true}
      statement: {range: string, required: true}
      status: {range: FindingStatus, required: true}
      semantic_tags: {range: string, multivalued: true}
      entities: {range: string, multivalued: true}
      techniques: {range: string, multivalued: true}
      tactics: {range: string, multivalued: true}
      controls: {range: string, multivalued: true}
      references: {range: string, multivalued: true}
      evidence_ids: {range: string, multivalued: true}
      confidence: {range: string}
      created_at: {range: string}
      supersedes: {range: string, multivalued: true}

  EvidenceRecord:
    attributes:
      id: {range: string, required: true}
      experiment_id: {range: string}
      kind: {range: string, required: true}
      path: {range: string}
      sha256: {range: string}
      description: {range: string}
      collected_at: {range: string}

  Hypothesis:
    attributes:
      id: {range: string, required: true}
      statement: {range: string, required: true}
      status: {range: string, required: true}
      based_on: {range: string, multivalued: true}

  ExperimentRequest:
    attributes:
      id: {range: string, required: true}
      hypothesis_id: {range: string}
      objective: {range: string, required: true}
      requested_capabilities: {range: string, multivalued: true}
      evidence_required: {range: string, multivalued: true}
      approval_required: {range: boolean, ifabsent: true}
      status: {range: string, ifabsent: proposed}

  ExperimentStep:
    attributes:
      id: {range: string, required: true}
      objective: {range: string}
      capability: {range: string}
      capabilities: {range: string, multivalued: true}
      depends_on: {range: string, multivalued: true}
      inputs: {range: string, multivalued: true}
      outputs: {range: string, multivalued: true}
      approval_required: {range: boolean, ifabsent: false}

  ExperimentResult:
    attributes:
      id: {range: string, required: true}
      request_id: {range: string, required: true}
      status: {range: string, required: true}
      evidence_ids: {range: string, multivalued: true}
      conclusion: {range: string}

  ResearchFinding:
    attributes:
      id: {range: string, required: true}
      statement: {range: string, required: true}
      evidence_ids: {range: string, multivalued: true}
      confidence: {range: string}

  OrchestrationSpec:
    attributes:
      executor: {range: string, ifabsent: codex}
      mode: {range: string, ifabsent: interactive}
      allow_skill_selection: {range: boolean, ifabsent: true}
      allow_skill_composition: {range: boolean, ifabsent: true}
      require_researcher_approval_for_new_skill: {range: boolean, ifabsent: true}
      require_researcher_approval_for_new_capability: {range: boolean, ifabsent: true}

  CodexSpec:
    attributes:
      sandbox_mode: {range: string, ifabsent: workspace-write}
      approval_policy: {range: string, ifabsent: on-request}
      network_access_enabled: {range: boolean, ifabsent: false}
      web_search_mode: {range: string, ifabsent: disabled}
      model: {range: string}
      reasoning_effort: {range: string, ifabsent: medium}
      idle_timeout_seconds: {range: integer, minimum_value: 1, ifabsent: 120}
      persist_session: {range: boolean, ifabsent: true}
      skip_git_repo_check: {range: boolean, ifabsent: false}

  # Legacy inline compute is retained only as a deprecated schema shape.
  # New recipes should use infrastructure_profile.
  ComputeSpec:
    attributes:
      provider: {range: string, required: true}
      image: {range: string}
      instance: {range: string}
      cpu: {range: integer}
      memory_mb: {range: integer}
      architecture: {range: string}
      network: {range: string}
      ephemeral: {range: boolean, ifabsent: true}
      snapshot: {range: string}

  SandboxSpec:
    attributes:
      backend: {range: string, required: true}
      image: {range: string}
      workspace_directory: {range: string}
      inherit_host_environment: {range: boolean, ifabsent: false}

  NetworkSpec:
    attributes:
      mode: {range: string, ifabsent: none}

  McpServerSpec:
    attributes:
      label: {range: string, required: true}
      transport: {range: string, required: true}

  PolicySpec:
    attributes:
      allow: {range: string, multivalued: true}
      deny: {range: string, multivalued: true}
      approval_required: {range: string, multivalued: true}

  ComputeRequirements:
    attributes:
      required: {range: string, multivalued: true}
      preferred: {range: string, multivalued: true}

  InstrumentationSpec:
    attributes:
      required: {range: string, multivalued: true}
      preferred: {range: string, multivalued: true}
      tools: {range: string, multivalued: true}
      trace_flags: {range: string, multivalued: true}
      events: {range: string, multivalued: true}
      probes: {range: string, multivalued: true}
      collectors: {range: string, multivalued: true}

  EvidenceSpec:
    attributes:
      required: {range: string, multivalued: true, required: true}
      hash_algorithm: {range: string, ifabsent: sha256}
      manifest: {range: boolean, ifabsent: true}

  CompletionSpec:
    attributes:
      report_required: {range: boolean, ifabsent: true}
      conclusion_required: {range: boolean, ifabsent: true}

  WorkloadSpec:
    attributes:
      command: {range: string}
      timeout_seconds: {range: integer, minimum_value: 1, ifabsent: 300}

  ReportSpec:
    attributes:
      kind: {range: ReportFormat, required: true}
      template: {range: string, required: true}
