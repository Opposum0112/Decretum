apiVersion: decretum.dev/v1
kind: CapabilityRegistry
version: "2.0"

# Canonical researcher-approved capability semantics.
# Providers implement these semantics; they never define them.
capabilities:
  artifact.read:
    id: artifact.read
    name: Read research artifacts
    kind: artifact
    risk: read
    description: Read artifacts made available to the research session.

  artifact.collect:
    id: artifact.collect
    name: Collect research artifacts
    kind: artifact
    risk: collect
    description: Preserve artifacts as research evidence.

  artifact.scan:
    id: artifact.scan
    name: Scan an artifact
    kind: artifact
    risk: observe
    description: Analyze an artifact for security-relevant indicators.

  process.observe:
    id: process.observe
    name: Observe processes
    kind: process
    risk: observe
    description: Observe process execution and metadata.

  process.execute:
    id: process.execute
    name: Execute a process
    kind: process
    risk: execute
    requires_approval: true
    description: Execute a researcher-authorized workload process.

  syscall.observe:
    id: syscall.observe
    name: Observe system calls
    kind: instrumentation
    risk: observe
    description: Observe system call activity generated by a workload.

  filesystem.observe:
    id: filesystem.observe
    name: Observe filesystem activity
    kind: filesystem
    risk: observe
    description: Observe filesystem activity relevant to the research workload.

  network.observe:
    id: network.observe
    name: Observe network activity
    kind: network
    risk: observe
    description: Observe network activity and connection metadata.

  network.capture:
    id: network.capture
    name: Capture network traffic
    kind: network
    risk: collect
    description: Capture network traffic as research evidence.

  network.metadata:
    id: network.metadata
    name: Produce network metadata
    kind: network
    risk: observe
    description: Produce structured metadata from observed network activity.

  protocol.analyze:
    id: protocol.analyze
    name: Analyze network protocols
    kind: network
    risk: observe
    description: Decode and analyze network protocol behavior.

  network.detection:
    id: network.detection
    name: Detect network security events
    kind: network
    risk: observe
    description: Identify security-relevant network events from observed traffic.

  compute.vm:
    id: compute.vm
    name: Execute in a virtual machine
    kind: compute
    risk: execute
    requires_approval: true
    description: Execute research workloads inside a virtual machine.

  compute.container:
    id: compute.container
    name: Execute in a container
    kind: compute
    risk: execute
    requires_approval: true
    description: Execute research workloads inside a container.

  compute.microvm:
    id: compute.microvm
    name: Execute in a microVM
    kind: compute
    risk: execute
    requires_approval: true
    description: Execute research workloads inside a microVM.

  compute.snapshot:
    id: compute.snapshot
    name: Snapshot execution state
    kind: compute
    risk: collect
    description: Capture a reusable snapshot of execution state.

  workspace.execute:
    id: workspace.execute
    name: Execute in a research workspace
    kind: process
    risk: execute
    requires_approval: true
    description: Execute researcher-authorized operations in an isolated workspace.

  container.observe:
    id: container.observe
    name: Observe container activity
    kind: container
    risk: observe
    description: Observe container lifecycle and activity.

  kernel.trace:
    id: kernel.trace
    name: Trace kernel activity
    kind: instrumentation
    risk: observe
    description: Observe kernel-level activity relevant to security research.

  detection.observe:
    id: detection.observe
    name: Observe detection events
    kind: analysis
    risk: observe
    description: Observe security detection events produced by an instrumentation surface.

  memory.acquire:
    id: memory.acquire
    name: Acquire memory evidence
    kind: artifact
    risk: collect
    description: Acquire a memory image or equivalent memory evidence.

  memory.analyze:
    id: memory.analyze
    name: Analyze memory evidence
    kind: analysis
    risk: observe
    description: Analyze memory evidence for security-relevant artifacts.

  malware.analyze:
    id: malware.analyze
    name: Analyze malware artifacts
    kind: analysis
    risk: observe
    description: Analyze malware-related artifacts in an isolated research context.

  binary.analyze:
    id: binary.analyze
    name: Analyze binary artifacts
    kind: analysis
    risk: observe
    description: Analyze executable binary artifacts.

  reverse_engineer:
    id: reverse_engineer
    name: Reverse engineer software
    kind: analysis
    risk: observe
    description: Perform authorized reverse-engineering analysis.

