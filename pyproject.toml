[project]
name = "decretum"
version = "0.3.0"
description = "Domain-neutral declarative execution compiler for agents and harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "linkml>=1.9",
  "pydantic>=2.6",
  "fastmcp>=0.1.0",
  "typer>=0.9",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "rich>=13.7",
]

[project.scripts]
decretum = "sec_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sec_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
