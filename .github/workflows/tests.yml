name: Tests

on:
  push:
    branches: ["main", "capability-compiler-evolution"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Validate
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== Python =="
            python --version
            echo "== uv =="
            uv --version
            echo "== Sync =="
            uv sync --group dev
            echo "== Domain packs =="
            uv pip install -e packages/decretum-security-research -e packages/decretum-software-engineering
            echo "== Tests =="
            uv run pytest -q
            echo "== Lint =="
            uv run ruff check .
          } 2>&1 | tee validation.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
