name: Tests

on:
  push:
    branches: ["main", "capability-compiler-evolution"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest
